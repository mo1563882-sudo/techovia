<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techovia QR studio - مولد كيو آر احترافي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0d6efd; /* Techovia Blue */
            --bg-light: #f8f9fa;
            --bg-dark: #121212;
            --text-dark: #212529;
            --text-light: #f8f9fa;
            --panel-bg-light: #ffffff;
            --panel-bg-dark: #1e1e1e;
            --border-radius: 12px;
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            transition: var(--transition);
        }

        /* Dark Mode Styles */
        body.dark-mode {
            background-color: var(--bg-dark);
            color: var(--text-light);
        }
        body.dark-mode .card, 
        body.dark-mode .accordion-item,
        body.dark-mode .form-control,
        body.dark-mode .form-select {
            background-color: var(--panel-bg-dark);
            color: var(--text-light);
            border-color: #333;
        }
        body.dark-mode .accordion-button {
            background-color: var(--panel-bg-dark);
            color: var(--text-light);
        }
        body.dark-mode .accordion-button:not(.collapsed) {
            background-color: #2c3e50;
            color: #fff;
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        body.dark-mode header {
            background: rgba(18, 18, 18, 0.9);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            font-size: 24px;
            color: var(--primary-color);
        }

        /* Controls */
        .settings-panel {
            padding: 20px 0;
        }
        .nav-tabs .nav-link {
            color: inherit;
            border-radius: var(--border-radius) var(--border-radius) 0 0;
        }
        .nav-tabs .nav-link.active {
            font-weight: bold;
            color: var(--primary-color);
        }

        /* Sticky Preview */
        .preview-wrapper {
            position: sticky;
            top: 100px;
            background: var(--panel-bg-light);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            transition: var(--transition);
        }
        body.dark-mode .preview-wrapper {
            background: var(--panel-bg-dark);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        #canvas-container {
            margin: 0 auto 20px auto;
            max-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #canvas-container canvas {
            max-width: 100%;
            height: auto !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
        }

        /* Range Sliders */
        input[type=range] {
            width: 100%;
            cursor: pointer;
        }

        /* Buttons */
        .btn-custom {
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 600;
        }

        /* Footer */
        footer {
            margin-top: 50px;
            padding: 20px;
            text-align: center;
            font-size: 0.9rem;
            border-top: 1px solid rgba(0,0,0,0.1);
        }
        .copyright-symbol {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border: 1px solid currentColor;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 12px;
            margin: 0 3px;
        }

        /* Success/Error Toast */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 9999;
        }

    </style>
</head>
<body>

    <header>
        <div class="container d-flex justify-content-between align-items-center">
            <div class="logo-area">
                <div class="logo-icon"><i class="fa-solid fa-qrcode"></i></div>
                <h4 class="m-0 fw-bold">Techovia QR Stodeo</h4>
            </div>
            <div class="actions">
                <button class="btn btn-outline-secondary rounded-pill" id="darkModeToggle">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="container mt-4">
        <div class="row">
            <div class="col-lg-7 mb-5 settings-panel">
                
                <ul class="nav nav-tabs mb-3" id="contentTab" role="tablist">
                    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#url-tab"><i class="fa-solid fa-link me-2"></i>رابط</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#text-tab"><i class="fa-solid fa-align-right me-2"></i>نص</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#email-tab"><i class="fa-solid fa-envelope me-2"></i>إيميل</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#phone-tab"><i class="fa-solid fa-phone me-2"></i>هاتف</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#wifi-tab"><i class="fa-solid fa-wifi me-2"></i>واي فاي</button></li>
                </ul>

                <div class="tab-content card p-3 mb-4 shadow-sm" id="contentTabContent">
                    <div class="tab-pane fade show active" id="url-tab">
                        <label class="form-label">ضع الرابط هنا:</label>
                        <input type="url" class="form-control input-data" id="data-url" placeholder="https://techovia.com" value="https://techovia.com">
                    </div>
                    <div class="tab-pane fade" id="text-tab">
                        <label class="form-label">اكتب النص هنا:</label>
                        <textarea class="form-control input-data" id="data-text" rows="3" placeholder="أدخل النص الخاص بك..."></textarea>
                    </div>
                    <div class="tab-pane fade" id="email-tab">
                        <div class="mb-2"><input type="email" class="form-control input-data" id="data-email-addr" placeholder="البريد الإلكتروني"></div>
                        <div class="mb-2"><input type="text" class="form-control input-data" id="data-email-sub" placeholder="الموضوع"></div>
                        <div><textarea class="form-control input-data" id="data-email-body" placeholder="الرسالة"></textarea></div>
                    </div>
                    <div class="tab-pane fade" id="phone-tab">
                        <label class="form-label">رقم الهاتف:</label>
                        <input type="tel" class="form-control input-data" id="data-phone" placeholder="+963900000000">
                    </div>
                    <div class="tab-pane fade" id="wifi-tab">
                        <div class="mb-2"><input type="text" class="form-control input-data" id="data-wifi-ssid" placeholder="اسم الشبكة (SSID)"></div>
                        <div class="mb-2"><input type="text" class="form-control input-data" id="data-wifi-pass" placeholder="كلمة المرور"></div>
                        <select class="form-select input-data" id="data-wifi-type">
                            <option value="WPA">WPA/WPA2</option>
                            <option value="WEP">WEP</option>
                            <option value="nopass">بدون كلمة مرور</option>
                        </select>
                    </div>
                </div>

                <div class="accordion shadow-sm rounded" id="accordionSettings">
                    
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseColors">
                                <i class="fa-solid fa-palette me-2"></i> الألوان والشفافية
                            </button>
                        </h2>
                        <div id="collapseColors" class="accordion-collapse collapse show" data-bs-parent="#accordionSettings">
                            <div class="accordion-body">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">لون النقاط (QR)</label>
                                        <input type="color" class="form-control form-control-color w-100" id="color-dots" value="#000000">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">لون الخلفية</label>
                                        <input type="color" class="form-control form-control-color w-100" id="color-bg" value="#ffffff">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label d-flex justify-content-between"><span>شفافية الخلفية</span> <span id="bg-opacity-val">100%</span></label>
                                        <input type="range" class="form-range" id="bg-opacity" min="0" max="1" step="0.01" value="1">
                                    </div>
                                    <div class="col-12 mt-3">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="use-gradient">
                                            <label class="form-check-label" for="use-gradient">تفعيل التدرج اللوني (Gradient)</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6 gradient-opt d-none">
                                        <label class="form-label">اللون الثاني</label>
                                        <input type="color" class="form-control form-control-color w-100" id="color-dots-2" value="#0d6efd">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseDesign">
                                <i class="fa-solid fa-shapes me-2"></i> التصميم والشكل
                            </button>
                        </h2>
                        <div id="collapseDesign" class="accordion-collapse collapse" data-bs-parent="#accordionSettings">
                            <div class="accordion-body">
                                <div class="mb-3">
                                    <label class="form-label">نمط النقاط (Body Shape)</label>
                                    <select class="form-select design-input" id="dots-type">
                                        <option value="square">مربعات (كلاسيكي)</option>
                                        <option value="dots">دوائر</option>
                                        <option value="rounded">زوايا دائرية</option>
                                        <option value="extra-rounded">دائرية جداً</option>
                                        <option value="classy">كلاسيكي معدل</option>
                                        <option value="classy-rounded">كلاسيكي ناعم</option>
                                    </select>
                                </div>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">شكل إطار العين</label>
                                        <select class="form-select design-input" id="corners-square-type">
                                            <option value="square">مربع</option>
                                            <option value="dot">نقطة</option>
                                            <option value="extra-rounded">دائري</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">شكل قلب العين</label>
                                        <select class="form-select design-input" id="corners-dot-type">
                                            <option value="square">مربع</option>
                                            <option value="dot">نقطة</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseLogo">
                                <i class="fa-solid fa-image me-2"></i> إضافة شعار
                            </button>
                        </h2>
                        <div id="collapseLogo" class="accordion-collapse collapse" data-bs-parent="#accordionSettings">
                            <div class="accordion-body">
                                <div class="mb-3">
                                    <label class="form-label">رفع شعار (وسط الكود)</label>
                                    <input class="form-control" type="file" id="logo-file" accept="image/*">
                                </div>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">حجم الشعار</label>
                                        <input type="range" class="form-range" id="logo-size" min="0.1" max="0.5" step="0.05" value="0.4">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">هامش الشعار</label>
                                        <input type="range" class="form-range" id="logo-margin" min="0" max="20" step="1" value="5">
                                    </div>
                                </div>
                                <div class="form-check form-switch mt-3">
                                    <input class="form-check-input" type="checkbox" id="remove-bg-behind-logo" checked>
                                    <label class="form-check-label" for="remove-bg-behind-logo">إزالة النقاط خلف الشعار</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseBgImg">
                                <i class="fa-solid fa-layer-group me-2"></i> دمج في صورة (خلفية)
                            </button>
                        </h2>
                        <div id="collapseBgImg" class="accordion-collapse collapse" data-bs-parent="#accordionSettings">
                            <div class="accordion-body">
                                <div class="alert alert-info py-2 small">
                                    <i class="fa-solid fa-info-circle"></i> يمكنك دمج الكود داخل صورة باختيار صورة كخلفية للكود.
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">رفع صورة خلفية</label>
                                    <input class="form-control" type="file" id="bg-image-file" accept="image/*">
                                </div>
                                <button class="btn btn-sm btn-outline-danger" id="clear-bg-image">إزالة الخلفية</button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <div class="col-lg-5">
                <div class="preview-wrapper">
                    <h5 class="mb-4 fw-bold">معاينة النتيجة</h5>
                    
                    <div id="canvas-container"></div>
                    
                    <div class="control-size mt-3 mb-4 px-4">
                        <label class="form-label text-muted small">دقة التصدير: <span id="size-val">1000px</span></label>
                        <input type="range" class="form-range" id="qr-size" min="300" max="2000" step="100" value="1000">
                    </div>

                    <div class="d-grid gap-2">
                        <button class="btn btn-primary btn-custom" id="btn-download-png">
                            <i class="fa-solid fa-download me-2"></i> تحميل PNG
                        </button>
                        <button class="btn btn-outline-primary btn-custom" id="btn-download-svg">
                            <i class="fa-solid fa-vector-square me-2"></i> تحميل SVG
                        </button>
                        <button class="btn btn-dark btn-custom" id="btn-export-html">
                            <i class="fa-brands fa-html5 me-2"></i> نسخ كود HTML
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p class="mb-0">
                جميع الحقوق محفوظة لمنصة Techovia <span class="copyright-symbol">c</span> 2026
            </p>
        </div>
    </footer>

    <div class="toast-container">
        <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    <i class="fa-solid fa-check-circle me-2"></i> <span id="toast-msg">تمت العملية بنجاح!</span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- 1. تهيئة المتغيرات الأساسية ---
            const qrCode = new QRCodeStyling({
                width: 300,
                height: 300,
                type: "svg", // Render type for preview
                data: "https://techovia.com",
                image: "",
                dotsOptions: { color: "#000000", type: "square" },
                backgroundOptions: { color: "#ffffff", },
                imageOptions: { crossOrigin: "anonymous", margin: 5 },
                cornersSquareOptions: { type: "square", color: "#000000" },
                cornersDotOptions: { type: "square", color: "#000000" },
            });

            // عرض الكيو آر في الصفحة
            qrCode.append(document.getElementById("canvas-container"));

            // --- 2. إدارة الحالة والمدخلات ---
            let currentData = "https://techovia.com";
            let currentType = "url";
            
            // دالة التحديث الرئيسية (مع Debounce لتحسين الأداء)
            let timeoutId;
            function updateQR() {
                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => {
                    generateQRData(); // تجميع البيانات
                    applyStyles();    // تطبيق الستايل
                }, 100);
            }

            // تجميع البيانات بناءً على التبويب النشط
            function generateQRData() {
                const activeTab = document.querySelector('.nav-link.active').getAttribute('data-bs-target');
                
                if (activeTab === '#url-tab') {
                    currentData = document.getElementById('data-url').value || "https://techovia.com";
                } else if (activeTab === '#text-tab') {
                    currentData = document.getElementById('data-text').value || "Techovia";
                } else if (activeTab === '#email-tab') {
                    const mail = document.getElementById('data-email-addr').value;
                    const sub = document.getElementById('data-email-sub').value;
                    const body = document.getElementById('data-email-body').value;
                    currentData = `mailto:${mail}?subject=${sub}&body=${body}`;
                } else if (activeTab === '#phone-tab') {
                    currentData = `tel:${document.getElementById('data-phone').value}`;
                } else if (activeTab === '#wifi-tab') {
                    const ssid = document.getElementById('data-wifi-ssid').value;
                    const pass = document.getElementById('data-wifi-pass').value;
                    const type = document.getElementById('data-wifi-type').value;
                    currentData = `WIFI:T:${type};S:${ssid};P:${pass};;`;
                }
                
                qrCode.update({ data: currentData });
            }

            // تطبيق الستايلات والألوان
            function applyStyles() {
                const dotColor = document.getElementById('color-dots').value;
                const dotColor2 = document.getElementById('color-dots-2').value;
                const useGradient = document.getElementById('use-gradient').checked;
                const bgColor = document.getElementById('color-bg').value;
                const bgOpacity = parseFloat(document.getElementById('bg-opacity').value); // 0 to 1

                // تحويل لون الخلفية إلى RGBA للشفافية
                const hexToRgb = (hex) => {
                    let r = parseInt(hex.slice(1, 3), 16);
                    let g = parseInt(hex.slice(3, 5), 16);
                    let b = parseInt(hex.slice(5, 7), 16);
                    return `${r}, ${g}, ${b}`;
                }
                const bgRgba = `rgba(${hexToRgb(bgColor)}, ${bgOpacity})`;

                const dotsType = document.getElementById('dots-type').value;
                const cornerSquareType = document.getElementById('corners-square-type').value;
                const cornerDotType = document.getElementById('corners-dot-type').value;
                
                const logoSize = parseFloat(document.getElementById('logo-size').value);
                const logoMargin = parseInt(document.getElementById('logo-margin').value);
                const removeBgLogo = document.getElementById('remove-bg-behind-logo').checked;

                const options = {
                    dotsOptions: {
                        type: dotsType,
                        color: dotColor
                    },
                    backgroundOptions: {
                        color: bgRgba,
                    },
                    cornersSquareOptions: { type: cornerSquareType, color: dotColor },
                    cornersDotOptions: { type: cornerDotType, color: dotColor },
                    imageOptions: {
                        imageSize: logoSize,
                        margin: logoMargin,
                        hideBackgroundDots: removeBgLogo
                    }
                };

                // Gradient Logic
                if (useGradient) {
                    options.dotsOptions.gradient = {
                        type: "linear",
                        rotation: 0,
                        colorStops: [{ offset: 0, color: dotColor }, { offset: 1, color: dotColor2 }]
                    };
                    // إزالة اللون الثابت عند استخدام التدرج
                    delete options.dotsOptions.color; 
                } else {
                    delete options.dotsOptions.gradient;
                    options.dotsOptions.color = dotColor;
                }

                qrCode.update(options);
            }

            // --- 3. مستمعي الأحداث (Event Listeners) ---
            
            // مراقبة كل المدخلات (Inputs)
            document.querySelectorAll('.input-data, .design-input, input[type=color], input[type=range]').forEach(el => {
                el.addEventListener('input', updateQR);
            });
            document.querySelectorAll('.form-check-input').forEach(el => {
                el.addEventListener('change', (e) => {
                     // إظهار/إخفاء خيار التدرج
                    if(e.target.id === 'use-gradient') {
                        document.querySelector('.gradient-opt').classList.toggle('d-none', !e.target.checked);
                    }
                    updateQR();
                });
            });

            // تبديل التبويبات
            const tabs = document.querySelectorAll('button[data-bs-toggle="tab"]');
            tabs.forEach(tab => {
                tab.addEventListener('shown.bs.tab', updateQR);
            });

            // رفع الشعار (Logo Upload)
            document.getElementById('logo-file').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = () => {
                        qrCode.update({ image: reader.result });
                    };
                    reader.readAsDataURL(file);
                } else {
                    qrCode.update({ image: "" });
                }
            });

            // رفع صورة الخلفية (Background Image Merge)
            document.getElementById('bg-image-file').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = () => {
                        // لإضافة صورة خلفية، نستبدل لون الخلفية بالصورة
                        qrCode.update({ backgroundOptions: { color: "transparent" } });
                        // ملاحظة: المكتبة تدعم وضع كيو آر فوق صورة عبر CSS أو canvas context
                        // هنا سنستخدم خاصية المكتبة الرسمية للخلفية إن وجدت، أو نضعها عبر CSS Container
                        document.getElementById('canvas-container').style.backgroundImage = `url(${reader.result})`;
                        document.getElementById('canvas-container').style.backgroundSize = 'cover';
                        document.getElementById('canvas-container').style.backgroundPosition = 'center';
                        document.getElementById('canvas-container').style.padding = '20px';
                        
                        // تعديل شفافية الخلفية للكود نفسه ليكون شفافاً
                        document.getElementById('bg-opacity').value = 0;
                        document.getElementById('bg-opacity-val').innerText = "0%";
                        updateQR();
                        showToast("تم دمج صورة الخلفية بنجاح");
                    };
                    reader.readAsDataURL(file);
                }
            });

            document.getElementById('clear-bg-image').addEventListener('click', () => {
                document.getElementById('bg-image-file').value = '';
                document.getElementById('canvas-container').style.backgroundImage = 'none';
                document.getElementById('canvas-container').style.padding = '0';
                document.getElementById('bg-opacity').value = 1;
                document.getElementById('bg-opacity-val').innerText = "100%";
                updateQR();
            });

            // تحديث نص القيمة للـ Sliders
            document.getElementById('bg-opacity').addEventListener('input', (e) => {
                document.getElementById('bg-opacity-val').innerText = Math.round(e.target.value * 100) + "%";
            });
            document.getElementById('qr-size').addEventListener('input', (e) => {
                document.getElementById('size-val').innerText = e.target.value + "px";
            });

            // --- 4. التصدير والتحميل ---
            
            // تحميل PNG
            document.getElementById('btn-download-png').addEventListener('click', () => {
                const size = parseInt(document.getElementById('qr-size').value);
                qrCode.update({ width: size, height: size });
                qrCode.download({ name: "techovia-qr", extension: "png" });
                // إعادة الحجم للعرض
                setTimeout(() => qrCode.update({ width: 300, height: 300 }), 500);
                showToast("جاري تحميل الصورة...");
            });

            // تحميل SVG
            document.getElementById('btn-download-svg').addEventListener('click', () => {
                const size = parseInt(document.getElementById('qr-size').value);
                qrCode.update({ width: size, height: size });
                qrCode.download({ name: "techovia-qr", extension: "svg" });
                setTimeout(() => qrCode.update({ width: 300, height: 300 }), 500);
                showToast("جاري تحميل SVG...");
            });

            // تصدير كود HTML
            document.getElementById('btn-export-html').addEventListener('click', async () => {
                const size = parseInt(document.getElementById('qr-size').value);
                
                // للحصول على Raw Blob
                const blob = await qrCode.getRawData("png");
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = function() {
                    const base64data = reader.result;
                    const htmlCode = `<img src="${base64data}" alt="Techovia QR Code" width="${size}" height="${size}" />`;
                    
                    navigator.clipboard.writeText(htmlCode).then(() => {
                        showToast("تم نسخ كود HTML للصورة إلى الحافظة");
                    });
                }
            });

            // --- 5. الوضع الليلي ---
            const toggleBtn = document.getElementById('darkModeToggle');
            toggleBtn.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const icon = toggleBtn.querySelector('i');
                if (document.body.classList.contains('dark-mode')) {
                    icon.classList.remove('fa-moon');
                    icon.classList.add('fa-sun');
                } else {
                    icon.classList.remove('fa-sun');
                    icon.classList.add('fa-moon');
                }
            });

            // Toast Function
            function showToast(message) {
                const toastEl = document.getElementById('liveToast');
                document.getElementById('toast-msg').innerText = message;
                const toast = new bootstrap.Toast(toastEl);
                toast.show();
            }

        });
    </script>
</body>
</html>
