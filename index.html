<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techovia QR Studio Pro | الإصدار الاحترافي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        body { overflow: hidden; } /* لمنع التمرير الخارجي والاعتماد على الأشرطة الداخلية */
        .sidebar-scroll { height: calc(100vh - 160px); overflow-y: auto; }
        .preview-area { background-color: #f8fafc; background-image: radial-gradient(#e2e8f0 1px, transparent 1px); background-size: 20px 20px; }
        .accordion-content { transition: max-height 0.3s ease-out; overflow: hidden; max-height: 0; }
        .accordion-content.open { max-height: 1000px; }
        .custom-range { width: 100%; height: 6px; background: #e2e8f0; border-radius: 5px; appearance: none; }
        .custom-range::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; background: #4f46e5; border-radius: 50%; cursor: pointer; }
        .qr-canvas-container { transition: transform 0.2s ease; cursor: grab; }
        .qr-canvas-container:active { cursor: grabbing; }
        .active-type { border-color: #4f46e5; background-color: #eef2ff; color: #4f46e5; }
        @media (max-width: 1024px) { body { overflow: auto; } .sidebar-scroll { height: auto; } }
    </style>
</head>
<body class="bg-white text-gray-900 transition-colors duration-300">

    <header class="h-16 border-b flex items-center justify-between px-6 bg-white z-10 relative">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-lg">
                <i class="fas fa-qrcode text-xl"></i>
            </div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">Techovia QR Studio</h1>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="resetApp()" class="p-2 text-gray-500 hover:text-red-500 transition-colors" title="إعادة تعيين">
                <i class="fas fa-undo-alt"></i>
            </button>
            <a href="https://techovia.com" target="_blank" class="text-sm font-medium text-indigo-600 hover:bg-indigo-50 px-3 py-2 rounded-lg transition-all">
                المزيد من الأدوات <i class="fas fa-external-link-alt mr-1"></i>
            </a>
        </div>
    </header>

    <main class="flex flex-col lg:flex-row h-[calc(100vh-64px)]">
        <aside class="w-full lg:w-96 border-l bg-gray-50 flex flex-col">
            <div class="p-4 border-b bg-white">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider text-right">لوحة التحكم والتصميم</p>
            </div>
            
            <div class="sidebar-scroll p-4 space-y-4 text-right">
                
                <div class="bg-white rounded-xl border shadow-sm">
                    <button onclick="toggleAccordion('sec1')" class="w-full p-4 flex justify-between items-center font-bold text-gray-700">
                        <i class="fas fa-chevron-down text-xs transition-transform" id="icon-sec1"></i>
                        <span>1. نوع المحتوى</span>
                    </button>
                    <div id="sec1" class="accordion-content open px-4 pb-4">
                        <div class="grid grid-cols-3 gap-2 mb-4">
                            <button onclick="setType('url')" id="btn-url" class="p-3 rounded-lg border text-center transition-all hover:border-indigo-400 active-type">
                                <i class="fas fa-link block mb-1"></i> <span class="text-xs">رابط</span>
                            </button>
                            <button onclick="setType('text')" id="btn-text" class="p-3 rounded-lg border text-center transition-all hover:border-indigo-400">
                                <i class="fas fa-align-left block mb-1"></i> <span class="text-xs">نص</span>
                            </button>
                            <button onclick="setType('wifi')" id="btn-wifi" class="p-3 rounded-lg border text-center transition-all hover:border-indigo-400">
                                <i class="fas fa-wifi block mb-1"></i> <span class="text-xs">Wi-Fi</span>
                            </button>
                        </div>
                        <div id="input-container">
                            </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl border shadow-sm">
                    <button onclick="toggleAccordion('sec2')" class="w-full p-4 flex justify-between items-center font-bold text-gray-700">
                        <i class="fas fa-chevron-down text-xs" id="icon-sec2"></i>
                        <span>2. الألوان والنمط</span>
                    </button>
                    <div id="sec2" class="accordion-content px-4 pb-4 space-y-4">
                        <div class="flex gap-4">
                            <div class="flex-1 text-right">
                                <label class="text-xs text-gray-500 block mb-1">لون QR</label>
                                <input type="color" id="fgColor" value="#000000" oninput="updateQR()" class="w-full h-10 rounded cursor-pointer">
                            </div>
                            <div class="flex-1 text-right">
                                <label class="text-xs text-gray-500 block mb-1">الخلفية</label>
                                <input type="color" id="bgColor" value="#ffffff" oninput="updateQR()" class="w-full h-10 rounded cursor-pointer">
                            </div>
                        </div>
                        <div class="text-right">
                            <label class="text-xs text-gray-500 block mb-2">مستوى تصحيح الخطأ (لإضافة شعار)</label>
                            <select id="errorLevel" onchange="updateQR()" class="w-full p-2 border rounded-lg text-sm bg-gray-50">
                                <option value="L">منخفض (L)</option>
                                <option value="M">متوسط (M)</option>
                                <option value="Q">جيد (Q)</option>
                                <option value="H" selected>عالٍ - يفضل للشعارات (H)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl border shadow-sm">
                    <button onclick="toggleAccordion('sec3')" class="w-full p-4 flex justify-between items-center font-bold text-gray-700">
                        <i class="fas fa-chevron-down text-xs" id="icon-sec3"></i>
                        <span>3. إضافة شعار</span>
                    </button>
                    <div id="sec3" class="accordion-content px-4 pb-4">
                        <div class="border-2 border-dashed rounded-xl p-4 text-center hover:bg-gray-50 transition-colors cursor-pointer relative">
                            <input type="file" id="logoInput" accept="image/*" onchange="handleLogo(this)" class="absolute inset-0 opacity-0 cursor-pointer">
                            <i class="fas fa-image text-2xl text-gray-300 mb-2"></i>
                            <p class="text-xs text-gray-500">اضغط لرفع شعار (PNG/JPG)</p>
                        </div>
                        <div id="logoControls" class="mt-4 hidden space-y-3">
                            <div class="flex justify-between items-center">
                                <span id="logoSizeVal" class="text-xs font-bold text-indigo-600">20%</span>
                                <label class="text-xs text-gray-500">حجم الشعار</label>
                            </div>
                            <input type="range" id="logoSize" min="10" max="40" value="20" oninput="updateQR()" class="custom-range">
                            <button onclick="removeLogo()" class="w-full py-2 text-xs text-red-500 border border-red-100 rounded hover:bg-red-50">حذف الشعار</button>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl border shadow-sm">
                    <button onclick="toggleAccordion('sec4')" class="w-full p-4 flex justify-between items-center font-bold text-gray-700">
                        <i class="fas fa-chevron-down text-xs" id="icon-sec4"></i>
                        <span>4. تصدير وتحميل</span>
                    </button>
                    <div id="sec4" class="accordion-content px-4 pb-4 space-y-4">
                        <div class="text-right">
                            <label class="text-xs text-gray-500 block mb-2">حجم الملف النهائي</label>
                            <select id="exportSize" class="w-full p-2 border rounded-lg text-sm bg-gray-50">
                                <option value="512">512 x 512 بكسل</option>
                                <option value="1024" selected>1024 x 1024 بكسل</option>
                                <option value="2048">2048 x 2048 (طباعة)</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="downloadQR('png')" class="bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition-all">تحميل PNG</button>
                            <button onclick="downloadQR('jpg')" class="bg-gray-800 text-white py-3 rounded-lg font-bold hover:bg-gray-900 transition-all">تحميل JPG</button>
                        </div>
                        <button onclick="downloadPDF()" class="w-full py-2 border-2 border-indigo-600 text-indigo-600 rounded-lg font-bold hover:bg-indigo-50">حفظ كـ PDF جاهز للطباعة</button>
                    </div>
                </div>

            </div>

            <div class="p-4 bg-indigo-50 mt-auto border-t">
                <p class="text-[10px] text-indigo-400 leading-relaxed text-right">
                    جميع الحقوق محفوظة لمنصة تكنوفيا 2026. <br>
                    ملاحظة هامة: يمكنك الآن اختبار سرعة الإنترنت الحقيقية عبر أداة تكنوفيا الحصرية.
                </p>
            </div>
        </aside>

        <section class="flex-1 preview-area flex flex-col relative">
            <div class="absolute top-6 left-1/2 -translate-x-1/2 z-10 flex gap-2 bg-white/80 backdrop-blur shadow-2xl p-2 rounded-2xl border">
                <button onclick="zoomQR(0.1)" class="w-10 h-10 rounded-xl hover:bg-gray-100"><i class="fas fa-search-plus"></i></button>
                <button onclick="zoomQR(-0.1)" class="w-10 h-10 rounded-xl hover:bg-gray-100"><i class="fas fa-search-minus"></i></button>
                <div class="w-px bg-gray-200 mx-1"></div>
                <button onclick="copyToClipboard()" class="flex items-center gap-2 px-4 hover:bg-gray-100 rounded-xl text-sm font-bold">
                    <i class="far fa-copy"></i> نسخ الصورة
                </button>
            </div>

            <div class="flex-1 flex items-center justify-center p-12">
                <div id="qr-wrapper" class="qr-canvas-container bg-white p-6 shadow-2xl rounded-3xl">
                    <canvas id="mainCanvas"></canvas>
                </div>
            </div>

            <div class="p-6 text-center text-gray-400 text-sm">
                <i class="fas fa-info-circle ml-1"></i> المعاينة تظهر الجودة الحقيقية - جميع التغييرات لحظية
            </div>
        </section>
    </main>

    <script>
        // State Management
        let appState = {
            type: 'url',
            content: 'https://techovia.com',
            zoom: 1,
            logoImg: null,
            logoScale: 0.2
        };

        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        // Initialization
        window.onload = () => {
            setType('url');
            updateQR();
        };

        function setType(type) {
            appState.type = type;
            document.querySelectorAll('[id^="btn-"]').forEach(el => el.classList.remove('active-type'));
            document.getElementById(`btn-${type}`).classList.add('active-type');
            
            const container = document.getElementById('input-container');
            if(type === 'url') {
                container.innerHTML = `<label class="text-xs text-gray-500 block mb-1 text-right">أدخل الرابط</label>
                    <input type="url" oninput="appState.content=this.value; updateQR()" class="w-full p-3 border rounded-xl bg-gray-50 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="https://example.com" value="${appState.content}">`;
            } else if(type === 'text') {
                container.innerHTML = `<label class="text-xs text-gray-500 block mb-1 text-right">أدخل النص</label>
                    <textarea oninput="appState.content=this.value; updateQR()" class="w-full p-3 border rounded-xl bg-gray-50 outline-none focus:ring-2 focus:ring-indigo-500" rows="3" placeholder="اكتب أي شيء هنا..."></textarea>`;
            } else if(type === 'wifi') {
                container.innerHTML = `
                    <div class="space-y-2 text-right">
                        <input type="text" id="w-ssid" placeholder="اسم الشبكة" oninput="buildWifi()" class="w-full p-2 border rounded-lg bg-gray-50">
                        <input type="text" id="w-pass" placeholder="كلمة المرور" oninput="buildWifi()" class="w-full p-2 border rounded-lg bg-gray-50">
                        <select id="w-enc" onchange="buildWifi()" class="w-full p-2 border rounded-lg bg-gray-50 text-sm">
                            <option value="WPA">WPA/WPA2</option>
                            <option value="WEP">WEP</option>
                        </select>
                    </div>`;
            }
        }

        function buildWifi() {
            const s = document.getElementById('w-ssid').value;
            const p = document.getElementById('w-pass').value;
            const t = document.getElementById('w-enc').value;
            appState.content = `WIFI:S:${s};T:${t};P:${p};;`;
            updateQR();
        }

        async function updateQR() {
            const size = 400; 
            canvas.width = size;
            canvas.height = size;

            const fgColor = document.getElementById('fgColor').value;
            const bgColor = document.getElementById('bgColor').value;
            const errorLevel = document.getElementById('errorLevel').value;

            try {
                // توليد الـ QR الأساسي على Canvas وسيط
                const tempCanvas = document.createElement('canvas');
                await QRCode.toCanvas(tempCanvas, appState.content || " ", {
                    width: size,
                    margin: 1,
                    errorCorrectionLevel: errorLevel,
                    color: { dark: fgColor, light: bgColor }
                });

                // رسم النتيجة النهائية
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, size, size);
                ctx.drawImage(tempCanvas, 0, 0);

                // رسم الشعار إذا وجد
                if (appState.logoImg) {
                    appState.logoScale = document.getElementById('logoSize').value / 100;
                    document.getElementById('logoSizeVal').innerText = document.getElementById('logoSize').value + "%";
                    
                    const logoW = size * appState.logoScale;
                    const logoH = (appState.logoImg.height * logoW) / appState.logoImg.width;
                    const x = (size - logoW) / 2;
                    const y = (size - logoH) / 2;

                    // خلفية بسيطة خلف الشعار لزيادة الوضوح
                    ctx.fillStyle = bgColor;
                    ctx.fillRect(x - 5, y - 5, logoW + 10, logoH + 10);
                    ctx.drawImage(appState.logoImg, x, y, logoW, logoH);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function handleLogo(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        appState.logoImg = img;
                        document.getElementById('logoControls').classList.remove('hidden');
                        updateQR();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function removeLogo() {
            appState.logoImg = null;
            document.getElementById('logoControls').classList.add('hidden');
            document.getElementById('logoInput').value = "";
            updateQR();
        }

        function zoomQR(val) {
            appState.zoom += val;
            appState.zoom = Math.max(0.5, Math.min(2, appState.zoom));
            document.getElementById('qr-wrapper').style.transform = `scale(${appState.zoom})`;
        }

        async function downloadQR(format) {
            const finalSize = parseInt(document.getElementById('exportSize').value);
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = finalSize;
            exportCanvas.height = finalSize;
            const eCtx = exportCanvas.getContext('2d');

            // إعادة رسم المحتوى بالجودة العالية
            const fgColor = document.getElementById('fgColor').value;
            const bgColor = document.getElementById('bgColor').value;
            
            const tempCanvas = document.createElement('canvas');
            await QRCode.toCanvas(tempCanvas, appState.content || " ", {
                width: finalSize,
                margin: 1,
                errorCorrectionLevel: document.getElementById('errorLevel').value,
                color: { dark: fgColor, light: bgColor }
            });

            eCtx.fillStyle = bgColor;
            eCtx.fillRect(0, 0, finalSize, finalSize);
            eCtx.drawImage(tempCanvas, 0, 0);

            if (appState.logoImg) {
                const logoW = finalSize * appState.logoScale;
                const logoH = (appState.logoImg.height * logoW) / appState.logoImg.width;
                eCtx.fillStyle = bgColor;
                eCtx.fillRect((finalSize - logoW)/2 - 10, (finalSize - logoH)/2 - 10, logoW + 20, logoH + 20);
                eCtx.drawImage(appState.logoImg, (finalSize - logoW)/2, (finalSize - logoH)/2, logoW, logoH);
            }

            const link = document.createElement('a');
            link.download = `techovia-qr-${Date.now()}.${format}`;
            link.href = exportCanvas.toDataURL(`image/${format === 'jpg' ? 'jpeg' : 'png'}`, 1.0);
            link.click();
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const imgData = canvas.toDataURL('image/png');
            doc.text("Techovia QR Code", 105, 20, { align: "center" });
            doc.addImage(imgData, 'PNG', 55, 40, 100, 100);
            doc.save("techovia-qr.pdf");
        }

        function copyToClipboard() {
            canvas.toBlob(blob => {
                const item = new ClipboardItem({ "image/png": blob });
                navigator.clipboard.write([item]).then(() => alert("تم نسخ الصورة إلى الحافظة!"));
            });
        }

        function toggleAccordion(id) {
            const content = document.getElementById(id);
            const icon = document.getElementById('icon-' + id);
            content.classList.toggle('open');
            icon.style.transform = content.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
        }

        function resetApp() {
            if(confirm("هل تريد مسح التصميم والبدء من جديد؟")) {
                location.reload();
            }
        }
    </script>
</body>
</html>
