<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>techovia_qr stodeo</title>
<!-- خط عصري -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --primary-color: #4f46e5; /* ألوان سورا 2 */
        --secondary-color: #6366f1;
        --accent-color: #818cf8;
        --bg-light: #f3f4f6;
        --bg-dark: #1f2937;
        --text-light: #ffffff;
        --text-dark: #111827;
        --error-color: #ef4444;
        --success-color: #22c55e;
    }
    body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-light);
        color: var(--text-dark);
        transition: background 0.3s, color 0.3s;
    }
    body.dark {
        background-color: var(--bg-dark);
        color: var(--text-light);
    }
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 2rem;
        background-color: var(--primary-color);
        color: white;
    }
    header h1 {
        font-size: 1.5rem;
        margin: 0;
    }
    header img {
        height: 40px;
    }
    .container {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1rem 2rem;
    }
    .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
    }
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        flex: 1 1 200px;
    }
    label {
        font-weight: 600;
    }
    input, select {
        padding: 0.5rem;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 1rem;
    }
    button {
        padding: 0.6rem 1rem;
        border: none;
        border-radius: 6px;
        background-color: var(--primary-color);
        color: white;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.3s;
    }
    button:hover {
        background-color: var(--secondary-color);
    }
    .preview-container {
        display: flex;
        justify-content: center;
        align-items: center;
        border: 2px dashed #ccc;
        border-radius: 12px;
        min-height: 300px;
        position: relative;
        overflow: hidden;
        background: white;
    }
    .preview-container.dragover {
        border-color: var(--primary-color);
        background-color: #eef2ff;
    }
    canvas {
        max-width: 100%;
        max-height: 100%;
    }
    .message {
        margin-top: 0.5rem;
        font-weight: 600;
    }
    .message.success { color: var(--success-color); }
    .message.error { color: var(--error-color); }

    /* القوائم القابلة للطي */
    details {
        margin-top: 0.5rem;
    }
    summary {
        font-weight: 600;
        cursor: pointer;
    }
    .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    /* الوضع الليلي */
    body.dark .preview-container {
        background: #374151;
        border-color: #4b5563;
    }
    body.dark input, body.dark select {
        background: #4b5563;
        color: white;
        border-color: #6b7280;
    }

    footer {
        text-align: center;
        padding: 1rem;
        font-size: 0.85rem;
        color: #6b7280;
    }

</style>
</head>
<body>
<header>
    <h1>techovia_qr stodeo</h1>
    <img src="https://cdn-icons-png.flaticon.com/512/634/634963.png" alt="Techovia QR Logo">
</header>

<div class="container">
    <div class="controls">
        <div class="control-group">
            <label for="qrText">نص / رابط الكيو آر</label>
            <input type="text" id="qrText" placeholder="أدخل النص أو الرابط">
        </div>
        <div class="control-group">
            <label for="qrType">نوع الكيو آر</label>
            <select id="qrType">
                <option value="url">URL</option>
                <option value="text">Text</option>
                <option value="email">Email</option>
                <option value="phone">Phone</option>
                <option value="sms">SMS</option>
                <option value="wifi">WiFi</option>
            </select>
        </div>
        <div class="control-group">
            <label for="size">حجم الكيو آر (px)</label>
            <input type="number" id="size" value="300" min="100" max="1000">
        </div>
        <div class="control-group">
            <label for="logoInput">إضافة شعار</label>
            <input type="file" id="logoInput" accept="image/*">
        </div>
    </div>

    <details>
        <summary>خيارات متقدمة</summary>
        <div class="control-group">
            <label for="qrBg">لون خلفية الكيو آر</label>
            <input type="color" id="qrBg" value="#ffffff">
        </div>
        <div class="control-group">
            <label for="qrFg">لون الكيو آر</label>
            <input type="color" id="qrFg" value="#000000">
        </div>
        <div class="control-group">
            <label><input type="checkbox" id="transparentBg"> خلفية شفافة</label>
        </div>
        <div class="control-group">
            <label><input type="checkbox" id="transparentQR"> شفافية الكيو آر</label>
        </div>
    </details>

    <button id="generateBtn">توليد الكيو آر</button>
    <button id="toggleTheme">تبديل الوضع الليلي</button>

    <div class="preview-container" id="previewContainer">
        <canvas id="qrCanvas"></canvas>
    </div>
    <div class="message" id="message"></div>

    <button id="downloadBtn">تحميل الكيو آر / الصورة</button>
</div>

<footer>
    جميع الحقوق محفوظة لمنصة techovia &copy; 2026
</footer>

<!-- مكتبة QR -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script>
const qrText = document.getElementById('qrText');
const qrType = document.getElementById('qrType');
const sizeInput = document.getElementById('size');
const logoInput = document.getElementById('logoInput');
const qrBg = document.getElementById('qrBg');
const qrFg = document.getElementById('qrFg');
const transparentBg = document.getElementById('transparentBg');
const transparentQR = document.getElementById('transparentQR');
const generateBtn = document.getElementById('generateBtn');
const qrCanvas = document.getElementById('qrCanvas');
const message = document.getElementById('message');
const downloadBtn = document.getElementById('downloadBtn');
const previewContainer = document.getElementById('previewContainer');
const toggleTheme = document.getElementById('toggleTheme');

function showMessage(text, type='success'){
    message.textContent = text;
    message.className = `message ${type}`;
}

// توليد QR
async function generateQR() {
    const canvas = qrCanvas;
    const size = parseInt(sizeInput.value);
    const options = {
        width: size,
        color: {
            dark: transparentQR.checked ? 'rgba(0,0,0,0)' : qrFg.value,
            light: transparentBg.checked ? 'rgba(0,0,0,0)' : qrBg.value
        }
    };
    try {
        let data = qrText.value;
        if(!data) {
            showMessage('الرجاء إدخال نص أو رابط.', 'error');
            return;
        }
        await QRCode.toCanvas(canvas, data, options);
        if(logoInput.files[0]){
            const ctx = canvas.getContext('2d');
            const logo = new Image();
            logo.src = URL.createObjectURL(logoInput.files[0]);
            logo.onload = () => {
                const scale = 0.2;
                const lw = canvas.width * scale;
                const lh = canvas.height * scale;
                ctx.drawImage(logo, (canvas.width-lw)/2, (canvas.height-lh)/2, lw, lh);
            };
        }
        showMessage('تم توليد الكيو آر بنجاح!');
    } catch(err){
        showMessage('حدث خطأ أثناء التوليد.', 'error');
        console.error(err);
    }
}

// تحميل QR
downloadBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'techovia_qr.png';
    link.href = qrCanvas.toDataURL();
    link.click();
});

// دعم السحب والإفلات
previewContainer.addEventListener('dragover', (e) => {
    e.preventDefault();
    previewContainer.classList.add('dragover');
});
previewContainer.addEventListener('dragleave', (e) => {
    e.preventDefault();
    previewContainer.classList.remove('dragover');
});
previewContainer.addEventListener('drop', (e) => {
    e.preventDefault();
    previewContainer.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if(file && file.type.startsWith('image/')){
        logoInput.files = e.dataTransfer.files;
        generateQR();
    }
});

generateBtn.addEventListener('click', generateQR);
toggleTheme.addEventListener('click', () => {
    document.body.classList.toggle('dark');
});

// دعم أسهم لوحة المفاتيح لتغيير الحجم
sizeInput.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowUp') sizeInput.value = parseInt(sizeInput.value) + 10;
    if(e.key === 'ArrowDown') sizeInput.value = parseInt(sizeInput.value) - 10;
    generateQR();
});

// دعم تغيير اللون والخيارات مباشرة
[qrBg, qrFg, transparentBg, transparentQR].forEach(el => {
    el.addEventListener('input', generateQR);
});
</script>
</body>
</html>
