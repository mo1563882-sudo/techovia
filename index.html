<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Studio</title>

    <style>
        body {
            margin: 0;
            background: #f5f5f5;
            font-family: "Tajawal", sans-serif;
            color: #222;
        }

        header {
            padding: 20px;
            background: #111;
            color: #fff;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: #fff;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        #qr-preview {
            margin-top: 25px;
            text-align: center;
        }

        #qr-preview canvas {
            max-width: 100%;
        }

        .btn {
            margin-top: 20px;
            padding: 14px;
            width: 100%;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .btn:hover {
            background: #000;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row > div {
            flex: 1;
        }
    </style>
</head>

<body>

<header>QR Studio — مولّد QR احترافي</header>

<div class="container">

    <label>النص أو الرابط</label>
    <input id="qr-text" type="text" placeholder="أدخل رابط أو نص" />

    <div class="row">
        <div>
            <label>لون النقاط</label>
            <input id="qr-color" type="color" value="#000000" />
        </div>

        <div>
            <label>لون الخلفية</label>
            <input id="qr-bg" type="color" value="#ffffff" />
        </div>
    </div>

    <label>الحجم</label>
    <select id="qr-size">
        <option value="256">256px</option>
        <option value="512">512px</option>
        <option value="1024">1024px</option>
    </select>

    <button class="btn" onclick="generateQR()">إنشاء QR</button>

    <div id="qr-preview"></div>

    <button class="btn" onclick="downloadPNG()">تحميل PNG</button>
    <button class="btn" onclick="downloadSVG()">تحميل SVG</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<script>
    let lastSVG = "";

    function generateQR() {
        const text = document.getElementById("qr-text").value.trim();
        const color = document.getElementById("qr-color").value;
        const bg = document.getElementById("qr-bg").value;
        const size = parseInt(document.getElementById("qr-size").value);

        if (!text) {
            alert("أدخل نص أو رابط أولاً");
            return;
        }

        const preview = document.getElementById("qr-preview");
        preview.innerHTML = "";

        // Canvas
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        preview.appendChild(canvas);

        QRCode.toCanvas(canvas, text, {
            width: size,
            color: {
                dark: color,
                light: bg
            }
        });

        // SVG
        QRCode.toString(text, {
            type: "svg",
            color: {
                dark: color,
                light: bg
            }
        }, function(err, svg) {
            if (!err) lastSVG = svg;
        });
    }

    function downloadPNG() {
        const canvas = document.querySelector("#qr-preview canvas");
        if (!canvas) return;

        const link = document.createElement("a");
        link.download = "qr.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
    }

    function downloadSVG() {
        if (!lastSVG) return;

        const blob = new Blob([lastSVG], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.href = url;
        link.download = "qr.svg";
        link.click();

        URL.revokeObjectURL(url);
    }
</script>

</body>
  </html>
